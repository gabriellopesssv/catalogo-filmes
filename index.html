<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#15101d">
    <title>Catálogo de Filmes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/pages.css">
</head>
<body>
    <header class="topo">
        <span class="marca">Catálogo</span>

        <nav class="abas" aria-label="Seções">
            <button type="button" class="aba" id="tabPopulares" aria-current="true">Populares</button>
            <button type="button" class="aba" id="tabMeus">Minha lista <span class="contagem" id="contagem">0</span></button>
        </nav>

        <form class="busca" id="searchForm" role="search">
            <label class="sr-only" for="searchInput">Buscar filmes</label>
            <input id="searchInput" type="search" placeholder="Buscar por título" autocomplete="off">
            <button class="btn btn-primary" type="submit">Buscar</button>
        </form>
    </header>

    <main class="conteudo" id="conteudo">
        <div id="alerta" class="alerta" role="alert" hidden></div>
        <div id="hero"></div>

        <div class="secao-topo">
            <h1 id="tituloSecao">Populares agora</h1>
            <p id="subSecao"></p>
        </div>

        <div id="filmesGrid" class="grade" aria-live="polite"></div>
    </main>

    <footer class="rodape">
        <p>Este produto usa a API do TMDB, mas não é endossado nem certificado pelo TMDB.</p>
        <button type="button" class="link" id="keyOpen">Chave da API</button>
    </footer>

    <div id="toast" class="toast" role="status" hidden>
        <span id="toastMsg"></span>
        <button type="button" class="toast-acao" id="toastAcao" hidden></button>
    </div>

    <dialog id="ratingDialog" aria-labelledby="ratingTitulo">
        <form id="ratingForm" method="dialog">
            <h2 id="ratingTitulo">Sua nota</h2>
            <p class="dialog-sub" id="ratingFilme"></p>
            <label for="ratingInput">Nota de 0 a 10</label>
            <input id="ratingInput" type="number" min="0" max="10" step="0.1" inputmode="decimal" required>
            <input id="ratingRange" type="range" min="0" max="10" step="0.5" aria-label="Ajustar nota">
            <p class="dialog-erro" id="ratingErro" hidden></p>
            <div class="dialog-acoes">
                <button type="button" class="btn btn-quiet" id="ratingCancelar">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar nota</button>
            </div>
        </form>
    </dialog>

    <dialog id="keyDialog" aria-labelledby="keyTitulo">
        <form id="keyForm" method="dialog">
            <h2 id="keyTitulo">Chave da API</h2>
            <p class="dialog-sub">Use sua própria chave TMDB v3. Ela fica salva só neste navegador.</p>
            <label for="keyInput">Chave</label>
            <input id="keyInput" type="text" autocomplete="off" spellcheck="false">
            <div class="dialog-acoes">
                <button type="button" class="btn btn-quiet" id="keyPadrao">Usar chave padrão</button>
                <button type="submit" class="btn btn-primary">Salvar chave</button>
            </div>
        </form>
    </dialog>

    <script src="static/js/pages.js"></script>
</body>
</html>
